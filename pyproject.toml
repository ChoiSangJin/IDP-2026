[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-dd"
version = "1.0.0"
description = "Offline-first database catalog, specification and ERD tool"
requires-python = ">=3.11"
dependencies = ["Flask>=3.1,<4", "openpyxl>=3.1,<4", "psycopg[binary]>=3.2,<4", "google-cloud-bigquery>=3.30,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7"]

[project.scripts]
auto-dd = "auto_dd.cli:main"

[tool.setuptools.package-data]
auto_dd = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
